name: Huawei Recorder Probe APK
on:
  push:
    branches: [ huawei-recorder-probe, huawei-callui-observer, huawei-audio-route-test ]
    paths:
      - 'HuaweiRecorderProbe/**'
      - '.github/workflows/huawei-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Huawei probe APK
        run: gradle -p HuaweiRecorderProbe assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HuaweiRecorderProbe-debug
          path: HuaweiRecorderProbe/app/build/outputs/apk/debug/app-debug.apk
