name: RecorderLab Android APK

on:
  push:
    branches: [ recorderlab-final ]
    paths:
      - 'RecorderLab_FreeOnly/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: RecorderLab_FreeOnly
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RecorderLab-debug-apk
          path: RecorderLab_FreeOnly/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
