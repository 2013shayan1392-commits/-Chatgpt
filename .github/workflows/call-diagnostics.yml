name: Shayan Call Diagnostics APK
on:
  push:
    branches: [ call-diagnostics-1.0 ]
    paths:
      - 'call-diagnostics/**'
      - '.github/workflows/call-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: call-diagnostics
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shayan-Call-Diagnostics-1.0
          path: call-diagnostics/app/build/outputs/apk/debug/app-debug.apk
