name: Safe Companion Android APK

on:
  push:
    branches: [ skvalex-recovery ]
    paths:
      - 'skvalex-recovery/safe-companion/**'
      - '.github/workflows/safe-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skvalex-recovery/safe-companion
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and run available unit tests
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug
      - name: Run Android lint
        run: gradle --no-daemon lintDebug
      - name: Android 10 emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: skvalex-recovery/safe-companion
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n org.shayan.skvalexcompanion/.MainActivity
            sleep 5
            adb shell pidof org.shayan.skvalexcompanion
            adb logcat -d -s AndroidRuntime:E | grep -F "FATAL EXCEPTION" | grep -F "org.shayan.skvalexcompanion" && exit 1 || true
      - name: Android 16 emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: skvalex-recovery/safe-companion
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n org.shayan.skvalexcompanion/.MainActivity
            sleep 5
            adb shell pidof org.shayan.skvalexcompanion
            adb logcat -d -s AndroidRuntime:E | grep -F "FATAL EXCEPTION" | grep -F "org.shayan.skvalexcompanion" && exit 1 || true
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Safe-Companion-debug
          path: skvalex-recovery/safe-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
